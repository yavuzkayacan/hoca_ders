<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Şifre Belirleme | İstanbul 29 Mayıs Üniversitesi</title>
    <link rel="icon" type="image/png" href="https://www.29mayis.edu.tr/public/images/favicon-32x32.png">
    <link rel="stylesheet" href="css/style.css?v=20260909_03">
    <style>
        body {
            background: linear-gradient(135deg, #0B1D2D 0%, #102A43 50%, #203551 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .reset-card {
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            animation: slideUp 0.35s ease-out;
        }

        .reset-header {
            background: linear-gradient(135deg, #102A43 0%, #203551 60%, #096ea9 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .reset-logo {
            width: 68px;
            height: 68px;
            background: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
            border: 3px solid var(--gold);
            padding: 5px;
            box-shadow: var(--shadow-md);
        }

        .reset-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .reset-body {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
    </style>
</head>
<body>

    <div class="reset-card">
        <div class="reset-header">
            <div class="reset-logo">
                <img src="https://www.29mayis.edu.tr/public/images/logo/logo.png" alt="İstanbul 29 Mayıs Üniversitesi">
            </div>
            <h2 style="font-size: 1.25rem; font-weight: 800;">Yeni Şifre Belirleme</h2>
            <p style="font-size: 0.85rem; color: rgba(255,255,255,0.85); margin-top: 0.2rem;">İstanbul 29 Mayıs Üniversitesi Kurumsal Hesabı</p>
        </div>

        <div class="reset-body">
            <div id="statusAlert" style="display: none; padding: 0.85rem; border-radius: var(--radius-md); font-size: 0.88rem;"></div>

            <form id="resetPasswordForm" style="display: flex; flex-direction: column; gap: 1rem;">
                <div class="form-group">
                    <label for="resetUsername">Kullanıcı Adınız</label>
                    <input type="text" id="resetUsername" class="form-control" readonly style="background: var(--surface-alt); font-weight: 700; color: var(--navy);">
                </div>

                <div class="form-group">
                    <label for="newPassword">Yeni Şifre</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="En az 6 karakter" required minlength="4">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Yeni Şifre (Tekrar)</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Şifrenizi tekrar giriniz" required minlength="4">
                </div>

                <button type="submit" class="btn btn-primary" style="padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem;" id="btnResetSubmit">
                    🔒 Şifremi Güncelle ve Kaydet
                </button>
            </form>

            <div style="text-align: center; margin-top: 0.5rem;">
                <a href="login.html" style="color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 600;">
                    &larr; Giriş Ekranına Dön
                </a>
            </div>
        </div>
    </div>

    <script src="js/mock-data.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('user') || 'ceng_baskan';
        const token = urlParams.get('token') || '';

        document.getElementById('resetUsername').value = username;

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;
            const statusBox = document.getElementById('statusAlert');

            if (p1 !== p2) {
                statusBox.style.display = 'block';
                statusBox.style.background = '#FEF2F2';
                statusBox.style.color = '#B91C1C';
                statusBox.style.border = '1px solid #FCA5A5';
                statusBox.textContent = 'Girdiğiniz şifreler birbiriyle eşleşmiyor.';
                return;
            }

            const btn = document.getElementById('btnResetSubmit');
            btn.disabled = true;
            btn.textContent = 'Kaydediliyor...';

            const res = await apiRequest('reset_password', 'POST', {
                username: username,
                token: token,
                new_password: p1
            });

            if (res && res.success) {
                statusBox.style.display = 'block';
                statusBox.style.background = '#ECFDF5';
                statusBox.style.color = '#047857';
                statusBox.style.border = '1px solid #6EE7B7';
                statusBox.innerHTML = '<strong>Başarılı!</strong> Şifreniz güncellendi. 2 saniye içinde giriş sayfasına yönlendiriliyorsunuz...';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                statusBox.style.display = 'block';
                statusBox.style.background = '#FEF2F2';
                statusBox.style.color = '#B91C1C';
                statusBox.style.border = '1px solid #FCA5A5';
                statusBox.textContent = res ? res.message : 'Şifre güncellenemedi.';
                btn.disabled = false;
                btn.textContent = '🔒 Şifremi Güncelle ve Kaydet';
            }
        });
    </script>
</body>
</html>
